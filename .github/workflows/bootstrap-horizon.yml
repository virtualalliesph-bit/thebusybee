name: Bootstrap Horizon rebuild

on:
  push:
    branches:
      - horizon-rebuild
    paths:
      - 'horizon-bootstrap.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-horizon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: horizon-rebuild

      - name: Fetch official Shopify Horizon
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Shopify/horizon.git /tmp/horizon

      - name: Replace branch with Horizon theme
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/horizon/assets .
          cp -a /tmp/horizon/blocks .
          cp -a /tmp/horizon/config .
          cp -a /tmp/horizon/layout .
          cp -a /tmp/horizon/locales .
          cp -a /tmp/horizon/sections .
          cp -a /tmp/horizon/snippets .
          cp -a /tmp/horizon/templates .
          cp /tmp/horizon/LICENSE.md .
          cp /tmp/horizon/README.md .
          cp /tmp/horizon/release-notes.md .
          rm -f horizon-bootstrap.trigger

      - name: Commit Horizon baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap rebuild from official Shopify Horizon"
          git push origin HEAD:horizon-rebuild
