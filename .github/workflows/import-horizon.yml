name: Import Horizon baseline

on:
  push:
    branches:
      - horizon-brand-refresh
    paths:
      - '.client-import/READY'

permissions:
  contents: write

jobs:
  import-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Busy Bee branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Shopify Horizon 4.2.0
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/Shopify/horizon.git /tmp/horizon

          python - <<'PY'
          import json
          with open('/tmp/horizon/config/settings_schema.json', encoding='utf-8') as f:
              info = json.load(f)[0]
          print(f"Official source: {info.get('theme_name')} {info.get('theme_version')}")
          if info.get('theme_name') != 'Horizon' or info.get('theme_version') != '4.2.0':
              raise SystemExit('Unexpected upstream Horizon version')
          PY

          rm -rf assets blocks config layout locales sections snippets templates
          cp -a /tmp/horizon/assets .
          cp -a /tmp/horizon/blocks .
          cp -a /tmp/horizon/config .
          cp -a /tmp/horizon/layout .
          cp -a /tmp/horizon/locales .
          cp -a /tmp/horizon/sections .
          cp -a /tmp/horizon/snippets .
          cp -a /tmp/horizon/templates .

          count="$(find assets blocks config layout locales sections snippets templates -type f | wc -l | tr -d ' ')"
          echo "Imported theme files: $count"
          test "$count" -gt 400

      - name: Commit Horizon baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .client-import
          rm -f .github/workflows/import-shopify-theme.yml
          rm -f .github/workflows/import-horizon.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Horizon 4.2.0 Shopify theme baseline"
          git push origin HEAD:horizon-brand-refresh
